<!doctype html>
<html><head><meta charset="utf-8">
<?!= HtmlService.createHtmlOutputFromFile('_sidebar_styles').getContent() ?>
<?!= HtmlService.createHtmlOutputFromFile('_sidebar_utils').getContent() ?>
</head><body>

<h2>✏️ Editar proyecto</h2>
<p class="subtitle">Cambiar fechas, prioridad, owner u objetivo</p>

<label>Escoge el proyecto</label>
<select id="project_id"><option value="">-- cargando --</option></select>

<div id="form_area" style="display:none">
  <div id="proj_info" class="proj-info"></div>

  <label>Nombre</label>
  <input id="nombre">

  <label>Responsable</label>
  <select id="owner_id"></select>

  <div class="row">
    <div>
      <label>Prioridad</label>
      <select id="prioridad">
        <option>Alta</option><option>Media</option><option>Baja</option>
      </select>
    </div>
    <div>
      <label>Frente</label>
      <input id="frente">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Fecha inicio</label>
      <input id="fecha_inicio" type="date">
    </div>
    <div>
      <label>Fecha fin</label>
      <input id="fecha_fin" type="date">
    </div>
  </div>

  <label>Objetivo</label>
  <textarea id="objetivo" rows="3"></textarea>

  <label>Link Drive</label>
  <input id="link_drive" type="url">

  <button type="button" class="btn" id="btnSave">Guardar cambios</button>
  <div id="msg" class="msg"></div>
</div>

<script>
var allProjects = [];
var allPersons = [];

function loadAll(){
  google.script.run.withSuccessHandler(function(list){
    allProjects = list;
    var sel = document.getElementById('project_id');
    sel.innerHTML = '<option value="">-- escoger --</option>';
    list.forEach(function(p){
      var opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.nombre + ' (' + p.owner_name + ')';
      sel.appendChild(opt);
    });
  }).getActiveProjectsForUI();
  google.script.run.withSuccessHandler(function(p){ allPersons = p; }).getActivePersonsForUI();
}

document.getElementById('project_id').addEventListener('change', function(){
  var pid = this.value;
  if (!pid) { document.getElementById('form_area').style.display = 'none'; return; }
  var p = allProjects.find(function(x){ return x.id === pid; });
  if (!p) return;

  document.getElementById('proj_info').innerHTML =
    '<b>' + esc(p.id) + ':</b> ' + esc(p.nombre) + '<br>Owner actual: <b>' + esc(p.owner_name) + '</b>';

  document.getElementById('nombre').value = p.nombre;
  document.getElementById('prioridad').value = p.prioridad || 'Media';
  document.getElementById('frente').value = p.frente || 'EQUIPO';
  document.getElementById('fecha_inicio').value = p.fecha_inicio;
  document.getElementById('fecha_fin').value = p.fecha_fin;
  document.getElementById('objetivo').value = p.objetivo;
  document.getElementById('link_drive').value = p.link_drive;

  var ownerSel = document.getElementById('owner_id');
  ownerSel.innerHTML = '';
  allPersons.forEach(function(per){
    var opt = document.createElement('option');
    opt.value = per.id; opt.textContent = per.nombre;
    if (per.id === p.owner_id) opt.selected = true;
    ownerSel.appendChild(opt);
  });

  document.getElementById('form_area').style.display = 'block';
});

document.getElementById('btnSave').addEventListener('click', function(){
  var pid = document.getElementById('project_id').value;
  if (!pid) return;
  var btn = this; var msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'Guardando...'; msg.className = 'msg';

  var payload = {
    project_id: pid,
    nombre: document.getElementById('nombre').value.trim(),
    owner_id: document.getElementById('owner_id').value,
    prioridad: document.getElementById('prioridad').value,
    frente: document.getElementById('frente').value,
    fecha_inicio: document.getElementById('fecha_inicio').value,
    fecha_fin: document.getElementById('fecha_fin').value,
    objetivo: document.getElementById('objetivo').value.trim(),
    link_drive: document.getElementById('link_drive').value.trim()
  };
  if (payload.fecha_inicio && payload.fecha_fin && payload.fecha_fin < payload.fecha_inicio) {
    msg.className = 'msg err'; msg.textContent = '❌ Fecha fin no puede ser anterior a fecha inicio';
    btn.disabled = false; btn.textContent = 'Guardar cambios'; return;
  }
  google.script.run
    .withSuccessHandler(function(){
      msg.className = 'msg ok'; msg.textContent = '✅ Proyecto actualizado';
      btn.disabled = false; btn.textContent = 'Guardar cambios';
      loadAll();
    })
    .withFailureHandler(function(err){
      msg.className = 'msg err'; msg.textContent = '❌ ' + err.message;
      btn.disabled = false; btn.textContent = 'Guardar cambios';
    })
    .updateProject(payload);
});

loadAll();
</script>
</body></html>
