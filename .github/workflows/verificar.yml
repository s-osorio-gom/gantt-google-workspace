name: verificar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxis, plantillas y duplicados
        run: python3 herramientas/verificar_apps_script.py apps-script
